name: Pipeline Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Drift Check
        run: node packages/check-drift.mjs

      - name: Run Budget Check
        run: |
          node -e '
          const { checkBudgets } = require("./packages/core-lib/budget-checker");
          const result = checkBudgets([
            "packages/create-playbook/templates",
            "packages/playbook-skill/assets"
          ]);
          if (result.failed) {
            console.error("Budget check failed!");
            process.exit(1);
          }
          console.log("Budget check passed successfully.");
          '
